name: Jarvis
options:
  bundleIdPrefix: it.gervasi
  developmentLanguage: it
  deploymentTarget:
    iOS: "17.0"
targets:
  Jarvis:
    type: application
    platform: iOS
    sources:
      - Jarvis
    info:
      path: Jarvis/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleDevelopmentRegion: it
        CFBundleShortVersionString: "1.$(CURRENT_PROJECT_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: SfondoAvvio
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "Jarvis usa il microfono per ascoltarLa quando gli parla."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.gervasi.jarvis
        PRODUCT_NAME: Jarvis
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
